<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinTrack Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="dashCss.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <h2><i class="fa-solid fa-layer-group"></i> FinTrack Pro</h2>

                <p>Enterprise Finance</p>

            </div>

            <nav>

                <a href="#" class="active">

                    <i class="fa-solid fa-table-columns"></i>

                    Dashboard

                </a>

                <a href="#">

                    <i class="fa-solid fa-gear"></i>

                    Settings

                </a>

            </nav>

            <button class="add-btn">

                <i class="fa-solid fa-plus"></i>

                Add Transaction

            </button>

        </aside>



        <!-- Main -->

        <main>

            <!-- Navbar -->

            <header class="topbar">

                <div></div>

                <div class="user">

                    <span>user12</span>

                    <button>

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </button>

                </div>

            </header>



            <!-- Heading -->

            <section class="heading">

                <h1>Financial Overview</h1>

                <p>Real-time tracking application</p>

            </section>



            <!-- Cards -->

            <section class="cards">

                <div class="card">

                    <div class="icon blue">

                        <i class="fa-solid fa-building-columns"></i>

                    </div>

                    <p>Current Balance</p>

                    <h2>$0.00</h2>

                </div>

                <div class="card">

                    <div class="icon green">

                        <i class="fa-solid fa-arrow-trend-up"></i>

                    </div>

                    <p>Total Income</p>

                    <h2 class="income">$0.00</h2>

                </div>

                <div class="card">

                    <div class="icon red">

                        <i class="fa-solid fa-arrow-trend-down"></i>

                    </div>

                    <p>Total Expense</p>

                    <h2 class="expense">$0.00</h2>

                </div>

                <div class="card">

                    <div class="icon blue">

                        <i class="fa-solid fa-piggy-bank"></i>

                    </div>

                    <p>Total Transactions</p>

                    <h2>0</h2>

                </div>

            </section>



            <!-- Bottom -->

            <section class="bottom">

                <!-- Chart -->

                <div class="chart">

                    <h2>Cash Flow Analysis</h2>

                    <div class="chart-box">

                        <div class="legend">

                            <span class="green-line"></span> Income

                            <span class="red-line"></span> Expenses

                        </div>

                    </div>

                </div>



                <!-- Preferences -->

                <div class="preferences">

                    <h2>Preferences</h2>

                    <div class="toggle">

                        <span>Dark Mode</span>

                        <div class="switch"></div>

                    </div>

                    <button class="reset">

                        <i class="fa-solid fa-trash"></i>

                        Reset All Data

                    </button>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
