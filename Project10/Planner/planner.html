<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner</title>
    <link rel="stylesheet" href="planner.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <nav>
        <div class="left">
            <h3><span>Daily</span> planner</h3>
        </div>

        <div class="right">
            <button class="nav-icon" id="themeBtn">
                <i class="ri-sun-line"></i>
            </button>

            <a href="https://github.com/DeeprajSaha" class="nav-icon" target="_blank">
                <i class="ri-github-line"></i>
            </a>
        </div>
    </nav>

    <a href="../index.html" class="homebtn">
        <i class="ri-arrow-left-line"></i>
        Home
    </a>

    <main>

        <div class="top">
            <h1>Today's Planner</h1>
            <button id="clrBtn">Clear All</button>
        </div>


        <div class="time-slot">
            <p>06:00 - 07:00 AM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>08:00 - 09:00 AM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>10:00 - 11:00 AM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>12:00 - 01:00 PM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>02:00 - 03:00 PM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>04:00 - 05:00 PM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>06:00 - 07:00 PM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>08:00 - 09:00 PM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>10:00 - 11:00 PM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

        <div class="time-slot">
            <p>12:00 - 01:00 AM</p>
            <input type="text" placeholder="What's your plan?">
        </div>

    </main>

    <script src="planner.js"></script>
</body>

</html>
